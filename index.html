<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منصة الالتزام — نحو التميز</title>
<meta name="description" content="منصة الالتزام — نحو التميز · شركة ابن رشد التعليمية القابضة">
<meta name="theme-color" content="#0d5c54">
<style>
  :root{--brand:#0d5c54;--gold:#b98b2e}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--brand)}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;background:var(--brand);color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;z-index:2;
    transition:opacity .4s}
  #splash.gone{opacity:0;pointer-events:none}
  #splash b{font-size:26px;letter-spacing:-.4px}
  #splash span{color:var(--gold);font-size:14px;letter-spacing:5px}
  .spin{width:34px;height:34px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--gold);
    border-radius:50%;animation:sp .8s linear infinite;margin-top:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  #err{display:none;max-width:460px;text-align:center;font-size:13px;line-height:1.9;color:#cfe3e0;padding:0 24px}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     ضع هنا رابط النشر (‎/exec) الخاص بمنصتك، بين علامتي التنصيص.
     تجده في محرر Apps Script: نشر ← إدارة عمليات النشر ← نسخ رابط تطبيق الويب.
     ولا بد أن ينتهي بـ ‎/exec‎ لا بـ ‎/dev‎.
     ═══════════════════════════════════════════════════════════════ -->
<script>
  var EXEC_URL = "https://script.google.com/macros/s/AKfycby8J8tj-bX8k_vcg13FcIvh8EIVPjhcpO3SEW-p6T9QVsl0PEqE8Yg3oGPeJHNk8JAMVQ/exec";
</script>

<div id="splash">
  <b>منصة الالتزام</b>
  <span>نحو التميز</span>
  <div class="spin" id="sp"></div>
  <div id="err"></div>
</div>

<script>
(function () {
  var sp = document.getElementById('splash'), err = document.getElementById('err');
  function fail(msg) {
    document.getElementById('sp').style.display = 'none';
    err.style.display = 'block';
    err.innerHTML = msg;
  }
  if (!/^https:\/\/script\.google\.com\/.*\/exec/.test(EXEC_URL)) {
    return fail('لم يُضبط رابط النشر بعد.<br>افتح هذا الملف بمحرر نصوص، وضع رابط ‎/exec‎ ' +
      'في السطر المعلَّم بأعلاه، واحفظ.');
  }
  var f = document.createElement('iframe');
  f.src = EXEC_URL;
  f.allow = 'clipboard-write; fullscreen';
  f.setAttribute('allowfullscreen', '');
  f.onload = function () { sp.classList.add('gone'); setTimeout(function () { sp.remove(); }, 450); };
  document.body.appendChild(f);
  setTimeout(function () {
    if (document.getElementById('splash')) fail('يتعذّر فتح المنصة.<br>تأكد أن النشر بصلاحية ' +
      '«أي شخص لديه الرابط»، وأن الرابط ينتهي بـ ‎/exec‎.');
  }, 20000);
})();
</script>
</body>
</html>
